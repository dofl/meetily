# Meetily CUDA build for the GTX 1650 (Windows)
#
# Produces a Windows installer where:
#   - the built-in Qwen summarizer (llama-helper sidecar) offloads to the GPU
#   - the Whisper transcription engine is CUDA-enabled (optional)
#   - Parakeet transcription is unchanged (CPU, fast enough)
#
# Model (e.g. a 3B Qwen) is selected AFTER install: Preferences > Summary Model > Built-in AI.
#
# How to run (free GitHub account, browser only):
#   1. Fork https://github.com/Zackriya-Solutions/meetily
#   2. In your fork: Add file > Create new file > path: .github/workflows/meetily-cuda-windows.yml > paste this > Commit
#   3. Actions tab > "Meetily CUDA (GTX 1650)" > Run workflow
#   4. Download the "meetily-cuda-windows" artifact when it finishes.
name: "Meetily CUDA (GTX 1650)"

on:
  workflow_dispatch:   # run manually

jobs:
  build-cuda-windows:
    # Pin VS2022 image: CUDA 12.4's nvcc can't pair with the newer VS2026/CMake4.4
    # on windows-latest ("No CUDA toolset found"). VS2022 + CUDA 12.4 is the known-good combo.
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install CUDA 12.4 (GTX 1650 = Turing compute 6.1)
        # Pins a toolkit that still supports the 1650 (CUDA 13 dropped old archs).
        # driver not installed — not needed to compile, only to run.
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: "12.4.0"
          method: "network"

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pinned pnpm (match Meetily's BUILDING.md)
        run: npm install -g pnpm@9.15.9

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build llama-helper sidecar with CUDA (the built-in Qwen summarizer)
        working-directory: llama-helper
        env:
          CMAKE_CUDA_ARCHITECTURES: "61"
          CMAKE_CUDA_STANDARD: "17"
        run: cargo build --release --features cuda

      - name: Install llama-helper sidecar into src-tauri/binaries
        shell: bash
        run: |
          mkdir -p frontend/src-tauri/binaries
          cp llama-helper/target/release/llama-helper.exe \
             frontend/src-tauri/binaries/llama-helper-x86_64-pc-windows-msvc.exe
          ls -lh frontend/src-tauri/binaries/llama-helper-*.exe

      - name: Build Meetily with CUDA for GTX 1650
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_GPU_FEATURE: cuda
          CMAKE_CUDA_ARCHITECTURES: "61"   # 61 = GTX 1650 (Turing, compute 6.1)
          CMAKE_CUDA_STANDARD: "17"
        with:
          projectPath: frontend
          args: --target x86_64-pc-windows-msvc --features cuda

      - name: Upload CUDA installer
        uses: actions/upload-artifact@v4
        with:
          name: meetily-cuda-windows
          path: |
            frontend/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            frontend/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          if-no-files-found: warn
          retention-days: 30